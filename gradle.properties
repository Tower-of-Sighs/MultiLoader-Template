# Important Notes:
# Every field you add must be added to buildSrc/src/main/kotlin/multiloader-common.gradle.kts expandProps map.

# Project
version=26.1.0.0
group=com.example.examplemod
java_version=25

# Common
minecraft_version=26.1
mod_name=ExampleMod
common_mainclassname=ExampleMod
fabric_mainclassname=ExampleModFabric
neoforge_mainclassname=ExampleModNeoForge
mod_author=Jared
mod_id=examplemod
license=CC0-1.0
credits=
description=The description of your mod. \nAccepts multilines.
minecraft_version_range=[26.1, 26.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.144.0+26.1
fabric_loader_version=0.18.4

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.0.1-beta
neoforge_loader_version_range=[4,)

# Release Publishing
release_type=release
# Valid values: client / server / both
release_dist=both
# Used by both Modrinth and CurseForge publishing tasks (supports multiline with \n)
release_changelog=No changelog was specified.
modrinth_project=
modrinth_project_fabric=
modrinth_project_neoforge=
curseforge_project=
curseforge_project_fabric=
curseforge_project_neoforge=

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
